<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chá de Panela</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff8f5;
            color: #5a4540;
            text-align: center;
        }

        header {
            background: #f3d6cf;
            padding: 60px 20px;
        }

        header h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        header p {
            font-size: 20px;
        }

        section {
            padding: 50px 20px;
            max-width: 900px;
            margin: auto;
        }

        h2 {
            font-size: 30px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            margin: 20px auto;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            max-width: 600px;
        }

        button {
            background: #c98f83;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #b97b70;
        }

        footer {
            background: #f3d6cf;
            padding: 30px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🏠 Chá de Panela</h1>
        <p>Estamos preparando um novo capítulo da nossa história! 💕</p>
    </header>

    <section>
        <h2>Você é nosso convidado! 💗</h2>

        <div class="card">
            <h2>📅 Data</h2>
            <p>Em breve colocaremos a data aqui.</p>
        </div>

        <div class="card">
            <h2>📍 Local</h2>
            <p>Em breve colocaremos o endereço aqui.</p>
        </div>

        <div class="card">
            <h2>🎁 Lista de presentes</h2>
            <p>Em breve colocaremos a lista de presentes aqui.</p>
        </div>

        <br>

        <button onclick="alert('Obrigada pela confirmação! 💕')">
            Confirmar presença
        </button>
    </section>

    <footer>
        <p>Com carinho, os noivos 💕</p>
    </footer>

</body>
</html>
